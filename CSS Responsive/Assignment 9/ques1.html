<!DOCTYPE html>
<html>
<head>
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="ques1.css">
</head>

<body>

    <header>
        <h1>Image Filter Gallery</h1>
    </header>

    <main>
        <section class="gallery">

            <div class="image-box">
                <img class="blur" src="https://picsum.photos/id/1015/400/300" alt="Mountain">
                <p>Blur</p>
            </div>

            <div class="image-box">
                <img class="gray" src="https://picsum.photos/id/1025/400/300" alt="Dog">
                <p>Grayscale</p>
            </div>

            <div class="image-box">
                <img class="sepia" src="https://picsum.photos/id/1035/400/300" alt="Nature">
                <p>Sepia</p>
            </div>

            <div class="image-box">
                <img class="bright" src="https://picsum.photos/id/1043/400/300" alt="Forest">
                <p>Brightness</p>
            </div>

            <div class="image-box">
                <img class="contrast" src="https://picsum.photos/id/1050/400/300" alt="Lake">
                <p>Contrast</p>
            </div>

            <div class="image-box">
                <img class="hue" src="https://picsum.photos/id/1069/400/300" alt="Road">
                <p>Hue Rotate</p>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Image Gallery</p>
    </footer>

</body>
</html>
