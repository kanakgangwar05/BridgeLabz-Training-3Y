<!DOCTYPE html>
<html>
<head>
    <title>Responsive CSS Cheat Sheet</title>
    <link rel="stylesheet" href="ques6.css">
</head>

<body>

    <header>
        <h1>Responsive CSS Cheat Sheet</h1>
    </header>

    <main>

        <section class="cheat-sheet">

            <div class="box">
                <h2>Filters</h2>
                <p>filter: grayscale(100%);</p>
            </div>

            <div class="box">
                <h2>Media Queries</h2>
                <p>@media (max-width: 700px)</p>
            </div>

            <div class="box">
                <h2>Responsive Design</h2>
                <p>Use flexible layouts for different screen sizes.</p>
            </div>

            <div class="box">
                <h2>Typography</h2>
                <p>font-size: clamp(1rem, 2vw, 1.5rem);</p>
            </div>

            <div class="box">
                <h2>Flexbox</h2>
                <p>display: flex;</p>
            </div>

            <div class="box">
                <h2>Grid</h2>
                <p>display: grid;</p>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 CSS Cheat Sheet</p>
    </footer>

</body>
</html>
