<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>
    <link rel="stylesheet" href="task_06_product-card .css">
</head>

<body>

<div class="card">

    <div class="image-box">
        <span class="discount">20% OFF</span>
        <span class="heart">♡</span>

        <img src="shoe.png" alt="Running Shoe">
    </div>

    <div class="details">

        <p class="category">SPORTS SHOES</p>

        <h2>Premium Running Shoes</h2>

        <div class="rating">
            ⭐ ⭐ ⭐ ⭐ ⭐
            <span>(120)</span>
        </div>

        <div class="price">
            ₹1,999
            <del>₹2,499</del>
        </div>

        <button>Add to Cart</button>

    </div>

</div>

</body>
</html>
