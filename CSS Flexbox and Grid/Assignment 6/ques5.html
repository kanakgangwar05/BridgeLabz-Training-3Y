<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="ques5.css">
</head>
<body>

    <h1>Our Pricing Plans</h1>
    <section class="pricing">

        <div class="card">
            <h2>Basic</h2>
            <h3>₹199</h3>
            <p>1 User</p>
            <p>5 GB Storage</p>
            <button>Choose Plan</button>
        </div>

        <div class="card middle">
            <h2>Standard</h2>
            <h3>₹499</h3>
            <p>5 Users</p>
            <p>20 GB Storage</p>
            <button>Choose Plan</button>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <h3>₹999</h3>
            <p>10 Users</p>
            <p>50 GB Storage</p>
            <button>Choose Plan</button>
        </div>

    </section>

</body>
</html>
