<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltip</title>
    <link rel="stylesheet" href="ques2.css">
</head>
<body>

    <header>
        <h1>CSS Tooltips</h1>
    </header>

    <main>
        <section class="tooltip-container">

            <div class="tooltip">
                Home
                <span class="tooltip-text">Go to Home</span>
            </div>

            <div class="tooltip">
                Profile
                <span class="tooltip-text">View Profile</span>
            </div>

            <div class="tooltip">
                Contact
                <span class="tooltip-text">Contact Us</span>
            </div>

        </section>
    </main>

</body>
</html>
