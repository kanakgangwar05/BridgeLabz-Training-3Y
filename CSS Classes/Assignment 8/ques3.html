<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="ques3.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/300/200?1" alt="Image 1">
                </div>
                <figcaption>Nature</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/300/200?2" alt="Image 2">
                </div>
                <figcaption>Mountain</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/300/200?3" alt="Image 3">
                </div>
                <figcaption>Forest</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/300/200?4" alt="Image 4">
                </div>
                <figcaption>Beach</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/300/200?5" alt="Image 5">
                </div>
                <figcaption>City</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/300/200?6" alt="Image 6">
                </div>
                <figcaption>Travel</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
