<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="ques3.css">
</head>
<body>

    <header class="bg-dark text-white text-center p-4">
        <h1>Our Products</h1>
        <p class="mb-0">Explore our latest collection</p>
    </header>

    <main class="container my-5">

        <section class="row g-4">

            <!-- Product 1 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm product-card">
                    <img src="https://picsum.photos/300/200?1"
                         class="card-img-top" alt="Headphones">

                    <div class="card-body text-center">
                        <h5 class="card-title">Headphones</h5>
                        <p class="text-primary fw-bold">₹1,499</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm product-card">
                    <img src="https://picsum.photos/300/200?2"
                         class="card-img-top" alt="Smart Watch">

                    <div class="card-body text-center">
                        <h5 class="card-title">Smart Watch</h5>
                        <p class="text-primary fw-bold">₹2,499</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm product-card">
                    <img src="https://picsum.photos/300/200?3"
                         class="card-img-top" alt="Speaker">

                    <div class="card-body text-center">
                        <h5 class="card-title">Bluetooth Speaker</h5>
                        <p class="text-primary fw-bold">₹999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card shadow-sm product-card">
                    <img src="https://picsum.photos/300/200?4"
                         class="card-img-top" alt="Keyboard">

                    <div class="card-body text-center">
                        <h5 class="card-title">Keyboard</h5>
                        <p class="text-primary fw-bold">₹1,199</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <footer class="text-center bg-dark text-white p-3">
        <p class="mb-0">&copy; 2026 Our Store</p>
    </footer>

</body>
</html>
