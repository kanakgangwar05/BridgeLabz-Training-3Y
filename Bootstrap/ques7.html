<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="ques7.css">
</head>
<body class="bg-light">

    <header class="bg-dark text-white p-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">Task Tracker</h1>

            <!-- Pending task counter -->
            <span class="badge bg-danger">3 Pending</span>
        </div>
    </header>

    <main class="container my-5">

        <section>
            <h2 class="mb-4">My Tasks</h2>

            <!-- Bootstrap list group -->
            <ul class="list-group">

                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Complete Assignment
                    <span class="badge bg-danger">High</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Study JavaScript
                    <span class="badge bg-warning text-dark">Medium</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Organize Notes
                    <span class="badge bg-success">Low</span>
                </li>

            </ul>

            <!-- Completed button with badge -->
            <button class="btn btn-primary mt-4">
                Completed <span class="badge bg-light text-dark">2</span>
            </button>

        </section>

    </main>

    <footer class="text-center bg-dark text-white p-3">
        <p class="mb-0">&copy; 2026 Task Tracker</p>
    </footer>

</body>
</html>
