<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="ques2.css">
</head>
<body class="bg-light text-dark">

    <header class="text-center bg-primary text-white p-5">
        <h1 class="fw-bold">Kanak Gangwar</h1>
        <p class="lead">Computer Science & Engineering</p>
    </header>

    <main class="container mt-4">

        <section class="text-center p-4">
            <!-- Responsive circular profile image -->
            <img src="https://picsum.photos/200"
                 alt="Profile"
                 class="img-fluid rounded-circle profile-img">

            <h2 class="mt-4 mb-3">About Me</h2>

            <p>
                I enjoy learning programming, web development, and data analytics.
                I am continuously improving my technical skills through projects.
            </p>

            <a href="#" class="btn btn-primary mt-3">Hire Me</a>
            <a href="#" class="btn btn-outline-dark mt-3">Download CV</a>
        </section>

        <!-- Contact form -->
        <section class="contact-form mx-auto mb-5">
            <h2 class="text-center mb-3">Contact Me</h2>

            <form>
                <input type="text" class="form-control mb-3"
                       placeholder="Your Name">

                <input type="email" class="form-control mb-3"
                       placeholder="Your Email">

                <textarea class="form-control mb-3"
                          rows="3"
                          placeholder="Your Message"></textarea>

                <button type="submit" class="btn btn-primary w-100">
                    Send Message
                </button>
            </form>
        </section>

    </main>

    <footer class="text-center bg-dark text-white p-3">
        <p class="mb-0">&copy; 2026 Kanak Gangwar</p>
    </footer>

</body>
</html>
