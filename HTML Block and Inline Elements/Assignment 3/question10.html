<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Selection</title>
</head>
<body>
    <h1>Choose Your Travel Destination</h1>

    <label for="country">Country:</label>

    <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="france">France</option>
        <option value="uae">United Arab Emirates</option>
        <option value="japan">Japan</option>
    </select>

    <br><br>

    <label for="state">State:</label>

    <select id="state" name="state">
        <option value="uttar-pradesh" selected>Uttar Pradesh</option>
        <option value="rajasthan">Rajasthan</option>
        <option value="goa">Goa</option>
        <option value="kerala">Kerala</option>
    </select>

    <br><br>

    <label for="city">City:</label>

    <select id="city" name="city">
        <option value="mathura" selected>Mathura</option>
        <option value="agra">Agra</option>
        <option value="lucknow">Lucknow</option>
        <option value="varanasi">Varanasi</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>

    <select id="place" name="place">
        <option value="taj-mahal" selected>Taj Mahal</option>
        <option value="gateway-of-india">Gateway of India</option>
        <option value="india-gate">India Gate</option>
        <option value="red-fort">Red Fort</option>
    </select>

    <br><br>
    <p>
        My selected travel destination is <strong>India</strong>,
        <strong>Uttar Pradesh</strong>, <strong>Mathura</strong>,
        and my favorite tourist place is the <strong>Taj Mahal</strong>.
    </p>
</body>
</html>
