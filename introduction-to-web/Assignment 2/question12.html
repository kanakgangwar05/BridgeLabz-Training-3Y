<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Formatting</title>
</head>
<body>
    <p>
        Learning <strong>HTML</strong> is
        <em>interesting</em> and
        <mark>creative</mark>.<br>
        Practice regularly to improve your skills.<br>
        <small>Keep learning and keep growing!</small>
    </p>
    
</body>
</html>
