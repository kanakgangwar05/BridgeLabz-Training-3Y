<!DOCTYPE html>
<html>
<head>
    <title>Student Table Filter</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        input {
            padding: 10px;
            width: 300px;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 500px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: lightgray;
        }

        #noResults {
            color: red;
            display: none;
        }
    </style>
</head>

<body>

    <h2>Student Details</h2>

    <input type="text" id="search"
           placeholder="Search student">

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Branch</th>
                <th>CGPA</th>
            </tr>
        </thead>

        <tbody id="studentTable">

            <tr>
                <td>Rahul</td>

            </tr>

            <tr>
                <td>Priya</td>
                <td>ECE</td>
                <td>9.2</td>
            </tr>

            <tr>
                <td>Aman</td>
                <td>IT</td>
                <td>7.8</td>
            </tr>

            <tr>
                <td>Neha</td>
                <td>CSE</td>
                <td>9.5</td>
            </tr>

            <tr>
                <td>Rohit</td>
                <td>Mechanical</td>
                <td>8.0</td>
            </tr>

        </tbody>

    </table>

    <p id="noResults">No results found</p>

    <script src="ques6.js"></script>
</body>
</html>
