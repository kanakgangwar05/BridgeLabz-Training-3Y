<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="ques1.css">
</head>
<body>

    <header>
        <h1>Borders and Padding</h1>
    </header>

    <main>
        <section class="box-container">

            <div class="box solid">
                <h2>Solid</h2>
                <p>Solid border with padding.</p>
            </div>

            <div class="box dashed">
                <h2>Dashed</h2>
                <p>Dashed border with padding.</p>
            </div>

            <div class="box double">
                <h2>Double</h2>
                <p>Double border with padding.</p>
            </div>

            <div class="box groove">
                <h2>Groove</h2>
                <p>Groove border with rounded corners.</p>
            </div>

        </section>
    </main>

    <footer>
        <p>Assignment 7 - Question 1</p>
    </footer>

</body>
</html>
