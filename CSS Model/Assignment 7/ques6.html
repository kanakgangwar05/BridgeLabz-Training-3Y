<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="ques6.css">
</head>
<body>

    <header>
        <h1>CSS Transformations</h1>
    </header>

    <main>
        <section class="transform-container">

            <div class="item">
                <div class="box rotate">1</div>
                <p>Rotate</p>
            </div>

            <div class="item">
                <div class="box scale">2</div>
                <p>Scale</p>
            </div>

            <div class="item">
                <div class="box translate">3</div>
                <p>Translate</p>
            </div>

            <div class="item">
                <div class="box skew">4</div>
                <p>Skew</p>
            </div>

        </section>
    </main>

</body>
</html>
